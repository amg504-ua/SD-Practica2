
services:
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "gTBb85_WRXu6oQgq-brTQw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  wm-central:
    build:
      context: .
      dockerfile: WM_Central/Dockerfile
    image: wm-central:dev
    container_name: wm-central
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      KAFKA_HOST: broker
      KAFKA_PORT: "29092"
    depends_on:
      broker:
        condition: service_healthy

  wm-fo:
    build:
      context: .
      dockerfile: WM_FieldOperator/Dockerfile
    image: wm-fo:dev
    container_name: wm-fo
    env_file:
      - .env
    environment:
      KAFKA_HOST: broker
      KAFKA_PORT: "29092"
    depends_on:
      broker:
        condition: service_healthy

  wm-engine:
    build:
      context: .
      dockerfile: WM_WateringStation/Engine/Dockerfile
    image: wm-engine:dev
    container_name: wm-engine
    env_file:
      - .env
    environment:
      KAFKA_HOST: broker
      KAFKA_PORT: "29092"
      MONITOR_HOST: wm-monitor
    depends_on:
      broker:
        condition: service_healthy
      wm-monitor:
        condition: service_started

  wm-monitor:
    build:
      context: .
      dockerfile: WM_WateringStation/Monitor/Dockerfile
    image: wm-monitor:dev
    container_name: wm-monitor
    env_file:
      - .env
    environment:
      CENTRAL_HOST: wm-central
    depends_on:
      wm-central:
        condition: service_started

volumes:
  kafka-data:
