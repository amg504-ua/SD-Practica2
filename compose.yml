services:
  broker:
    image: apache/kafka:latest
    hostname: broker
    container_name: broker
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "gTBb85_WRXu6oQgq-brTQw"

  mongo:
    image: mongo:latest
    ports:
      - 27017:27017
      
  wm-central:
    build:
      context: .
      dockerfile: WM_Central/Dockerfile
    image: wm-central:dev
    container_name: wm-central
    ports:
      - "5000:5000"
    env_file: 
      - .env

  wm-fo:
    build:
      context: .
      dockerfile: WM_FieldOperator/Dockerfile
    image: wm-fo:dev
    container_name: wm-fo

  wm-engine:
    build:
      context: .
      dockerfile: WM_WateringStation/Engine/Dockerfile
    image: wm-engine:dev
    container_name: wm-engine

  wm-monitor:
    build:
      context: .
      dockerfile: WM_WateringStation/Monitor/Dockerfile
    image: wm-monitor:dev
    container_name: wm-monitor
