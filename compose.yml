services:
  wm-engine:
    build:
      context: .
      dockerfile: WM_WateringStation/Engine/Dockerfile

    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      MONITOR_HOST: wm-monitor
      MONITOR_PORT: 5001
      PYTHONUNBUFFERED: 1
      PYTHONPATH: "."

  wm-monitor:
    build:
      context: .
      dockerfile: WM_WateringStation/Monitor/Dockerfile

    env_file:
      - .env
    environment:
      CENTRAL_HOST: ${CENTRAL_HOST}
      PYTHONUNBUFFERED: 1
      PYTHONPATH: "."

  wm-fo:
    build:
      context: .
      dockerfile: WM_FieldOperator/Dockerfile

    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      PYTHONUNBUFFERED: 1
      PYTHONPATH: "."
